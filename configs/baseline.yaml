# Baseline experiment configuration for NGE

name: baseline

model:
  embed_dim: 32
  residual_connections: true
  agg_fn: MAX
  num_mp_layers: 2
  dropout: 0.1
  num_update_layers: 1

training:
  epochs: 500
  learning_rate: 1.0e-5
  max_grad_norm: 1.0
  batch_size: 10
  eval_interval: 10
  seed: 42

data:
  train_path: data/train_dataset.npz
  val_path: data/val_dataset.npz
  test_path: data/test_dataset.npz

logging:
  use_wandb: false
  wandb_project: nge
  wandb_entity: ""
  log_interval: 1
  save_checkpoints: true
  checkpoint_interval: 50
