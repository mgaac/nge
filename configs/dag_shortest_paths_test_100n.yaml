name: dag-shortest-paths-test-100n

model:
  embed_dim: 32
  residual_connections: true
  agg_fn: MAX
  num_mp_layers: 2
  dropout: 0.1
  algorithms:
    - dag_shortest_paths
  termination_mode: distance
  termination_distance_latent: processed
  termination_distance: l2
  termination_distance_threshold: 12

training:
  epochs: 200
  learning_rate: 1.0e-5
  max_grad_norm: 1.0
  batch_size: 10
  eval_interval: 10
  seed: 42
  tasks: dag_shortest_paths

data:
  train_path: data/train_dag_shortest_paths_dataset.npz
  val_path: data/val_dag_shortest_paths_dataset.npz
  test_path: data/test_dag_shortest_paths_100n.npz

logging:
  use_wandb: false
  wandb_project: nge
  wandb_entity: ""
  log_interval: 1
  save_checkpoints: true
  checkpoint_interval: 50
  checkpoint_keep_last: 10
