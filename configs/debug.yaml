# Debug/fast iteration configuration for NGE

name: debug

model:
  embed_dim: 16
  residual_connections: true
  agg_fn: MAX
  num_mp_layers: 1
  dropout: 0.0
  num_update_layers: 1

training:
  epochs: 10
  learning_rate: 1.0e-4
  max_grad_norm: 1.0
  batch_size: 5
  eval_interval: 2
  seed: 42

data:
  train_path: data/train_dataset.npz
  val_path: data/val_dataset.npz
  test_path: data/test_dataset.npz

logging:
  use_wandb: false
  wandb_project: nge
  wandb_entity: ""
  log_interval: 1
  save_checkpoints: false
  checkpoint_interval: 10
