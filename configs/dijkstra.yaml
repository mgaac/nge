# Dijkstra single-task configuration for NGE

name: dijkstra

model:
  embed_dim: 32
  residual_connections: true
  agg_fn: MAX
  num_mp_layers: 2
  dropout: 0.1
  algorithms:
    - dijkstra
  termination_mode: distance
  termination_distance_latent: processed
  termination_distance: l2
  termination_distance_threshold: 12

training:
  epochs: 200
  learning_rate: 1.0e-5
  max_grad_norm: 1.0
  batch_size: 10
  eval_interval: 10
  seed: 42
  tasks: dijkstra

data:
  train_path: data/train_dijkstra_dataset.npz
  val_path: data/val_dijkstra_dataset.npz
  test_path: data/test_dijkstra_dataset.npz

logging:
  use_wandb: true
  wandb_project: nge-dijkstra
  wandb_entity: ""
  log_interval: 1
  save_checkpoints: true
  checkpoint_interval: 50
  checkpoint_keep_last: 10
