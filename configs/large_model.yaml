# Larger model configuration for NGE

name: large_model

model:
  embed_dim: 64
  residual_connections: true
  agg_fn: MAX
  num_mp_layers: 4
  dropout: 0.2
  num_update_layers: 2

training:
  epochs: 1000
  learning_rate: 5.0e-6
  max_grad_norm: 1.0
  batch_size: 8
  eval_interval: 10
  seed: 42

data:
  train_path: data/train_dataset.npz
  val_path: data/val_dataset.npz
  test_path: data/test_dataset.npz

logging:
  use_wandb: true
  wandb_project: nge
  wandb_entity: ""
  log_interval: 1
  save_checkpoints: true
  checkpoint_interval: 100
